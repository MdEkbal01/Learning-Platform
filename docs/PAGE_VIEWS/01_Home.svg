          <text x="68" y="50" font-size="11" font-weight="600" fill="#F3F4F6">LIVE SESSIONS DAILY</text>

          <text x="40" y="115" font-size="34" font-weight="800" fill="#FFFFFF">Master Software Engineering</text>
